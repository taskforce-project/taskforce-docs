<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 772" width="700" height="772" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="700" height="772" fill="#ffffff"/>

  <!-- arrow marker -->
  <defs>
    <marker id="tri" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="350" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1d1d1f">Smart-assign : deux étages de scoring</text>

  <!-- input pill -->
  <rect x="176" y="50" width="348" height="34" rx="10" fill="#eef3f8" stroke="#b8c2cc"/>
  <text x="350" y="72" text-anchor="middle" font-size="12.5" fill="#33475b">Vivier de membres actifs (hors congés VACATION / SICK)</text>
  <line x1="350" y1="86" x2="350" y2="106" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#tri)"/>

  <!-- STAGE 1 -->
  <rect x="50" y="108" width="600" height="212" rx="12" fill="#ffffff" stroke="#e6e6e9"/>
  <circle cx="82" cy="136" r="12" fill="#6e6e73"/>
  <text x="82" y="140.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="104" y="133" font-size="13.5" font-weight="700" fill="#1d1d1f">Pré-filtre déterministe (Java)</text>
  <text x="104" y="151" font-size="11.5" fill="#6e6e73">score heuristique pondéré, sans appel au modèle</text>

  <!-- stage1 bars -->
  <rect x="270" y="172" width="300" height="22" rx="5" fill="#f2f2f4"/>
  <rect x="270" y="172" width="300" height="22" rx="5" fill="#6e6e73"/>
  <text x="252" y="188" text-anchor="end" font-size="12.5" fill="#3a3a3c">Compétences</text>
  <text x="580" y="188" font-size="12.5" font-weight="600" fill="#1d1d1f">0,40</text>

  <rect x="270" y="204" width="300" height="22" rx="5" fill="#f2f2f4"/>
  <rect x="270" y="204" width="188" height="22" rx="5" fill="#c7c7cc"/>
  <text x="252" y="220" text-anchor="end" font-size="12.5" fill="#3a3a3c">Charge courante</text>
  <text x="580" y="220" font-size="12.5" font-weight="600" fill="#1d1d1f">0,25</text>

  <rect x="270" y="236" width="300" height="22" rx="5" fill="#f2f2f4"/>
  <rect x="270" y="236" width="150" height="22" rx="5" fill="#c7c7cc"/>
  <text x="252" y="252" text-anchor="end" font-size="12.5" fill="#3a3a3c">Disponibilité</text>
  <text x="580" y="252" font-size="12.5" font-weight="600" fill="#1d1d1f">0,20</text>

  <rect x="270" y="268" width="300" height="22" rx="5" fill="#f2f2f4"/>
  <rect x="270" y="268" width="113" height="22" rx="5" fill="#c7c7cc"/>
  <text x="252" y="284" text-anchor="end" font-size="12.5" fill="#3a3a3c">Historique</text>
  <text x="580" y="284" font-size="12.5" font-weight="600" fill="#1d1d1f">0,15</text>

  <!-- arrow to stage 2 -->
  <line x1="350" y1="320" x2="350" y2="352" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#tri)"/>
  <text x="368" y="341" font-size="12" font-weight="600" fill="#2563eb">5 meilleurs candidats retenus</text>

  <!-- STAGE 2 -->
  <rect x="50" y="356" width="600" height="286" rx="12" fill="#ffffff" stroke="#e6e6e9"/>
  <circle cx="82" cy="384" r="12" fill="#2563eb"/>
  <text x="82" y="388.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="104" y="381" font-size="13.5" font-weight="700" fill="#1d1d1f">Rerank sémantique par le modèle</text>
  <text x="104" y="399" font-size="11.5" fill="#6e6e73">modèle de langage local, servi par la passerelle d'inférence interne</text>

  <!-- stage2 bars -->
  <rect x="270" y="420" width="300" height="22" rx="5" fill="#f2f2f4"/>
  <rect x="270" y="420" width="300" height="22" rx="5" fill="#2563eb"/>
  <text x="252" y="436" text-anchor="end" font-size="12.5" fill="#3a3a3c">Sémantique</text>
  <text x="580" y="436" font-size="12.5" font-weight="600" fill="#1d1d1f">0,40</text>

  <rect x="270" y="452" width="300" height="22" rx="5" fill="#f2f2f4"/>
  <rect x="270" y="452" width="165" height="22" rx="5" fill="#bcd0f7"/>
  <text x="252" y="468" text-anchor="end" font-size="12.5" fill="#3a3a3c">Libellé et tags</text>
  <text x="580" y="468" font-size="12.5" font-weight="600" fill="#1d1d1f">0,22</text>

  <rect x="270" y="484" width="300" height="22" rx="5" fill="#f2f2f4"/>
  <rect x="270" y="484" width="120" height="22" rx="5" fill="#bcd0f7"/>
  <text x="252" y="500" text-anchor="end" font-size="12.5" fill="#3a3a3c">Charge courante</text>
  <text x="580" y="500" font-size="12.5" font-weight="600" fill="#1d1d1f">0,16</text>

  <rect x="270" y="516" width="300" height="22" rx="5" fill="#f2f2f4"/>
  <rect x="270" y="516" width="105" height="22" rx="5" fill="#bcd0f7"/>
  <text x="252" y="532" text-anchor="end" font-size="12.5" fill="#3a3a3c">Historique</text>
  <text x="580" y="532" font-size="12.5" font-weight="600" fill="#1d1d1f">0,14</text>

  <rect x="270" y="548" width="300" height="22" rx="5" fill="#f2f2f4"/>
  <rect x="270" y="548" width="60" height="22" rx="5" fill="#bcd0f7"/>
  <text x="252" y="564" text-anchor="end" font-size="12.5" fill="#3a3a3c">Disponibilité</text>
  <text x="580" y="564" font-size="12.5" font-weight="600" fill="#1d1d1f">0,08</text>

  <!-- growth note -->
  <rect x="104" y="586" width="452" height="30" rx="8" fill="#fff4ec" stroke="#f2c9a6"/>
  <text x="120" y="605" font-size="12" fill="#b5560f">+ bonus montée en compétence, plafonné à +15 points</text>

  <!-- arrow to output -->
  <line x1="350" y1="642" x2="350" y2="672" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#tri)"/>

  <!-- output pill -->
  <rect x="170" y="676" width="360" height="36" rx="10" fill="#2563eb"/>
  <text x="350" y="699" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">Recommandation d'affectation + score explicable</text>

  <!-- footnotes -->
  <rect x="60" y="728" width="10" height="10" rx="2" fill="#a1a1a6"/>
  <text x="80" y="737" font-size="11.5" fill="#6e6e73">Repli 100 % heuristique si le modèle échoue : aucun jeton consommé.</text>
  <rect x="60" y="750" width="10" height="10" rx="2" fill="#a1a1a6"/>
  <text x="80" y="759" font-size="11.5" fill="#6e6e73">Chaque décision journalisée (ai_runs, assignment_events) : boucle de feedback.</text>
</svg>
