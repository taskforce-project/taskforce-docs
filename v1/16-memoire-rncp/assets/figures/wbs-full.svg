<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 636" width="960" height="636" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="960" height="636" fill="#ffffff"/>
  <text x="30" y="26" font-size="16" font-weight="700" fill="#1d1d1f">Décomposition du travail (WBS) — projet TaskForce</text>
  <text x="30" y="44" font-size="10.5" fill="#6e6e73">Les sept phases du projet et leurs lots de travail. Version exhaustive ; le corps du dossier n'en donne qu'une vue resserrée.</text>

  <!-- root -->
  <rect x="380" y="58" width="200" height="34" rx="8" fill="#6e6e73"/>
  <text x="480" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Projet (travail)</text>
  <line x1="480" y1="92" x2="480" y2="108" stroke="#c7c7cc" stroke-width="1.5"/>
  <line x1="30" y1="108" x2="930" y2="108" stroke="#c7c7cc" stroke-width="1.5"/>
  <line x1="30" y1="108" x2="30" y2="598" stroke="#c7c7cc" stroke-width="1.5"/>
  <line x1="496" y1="108" x2="496" y2="432" stroke="#c7c7cc" stroke-width="1.5"/>

  <!-- ===== COLUMN A ===== -->
  <!-- P1 -->
  <line x1="30" y1="184" x2="46" y2="184" stroke="#c7c7cc" stroke-width="1.5"/>
  <g>
    <rect x="46" y="124" width="424" height="120" rx="9" fill="#ffffff" stroke="#d7dae0"/>
    <rect x="60" y="134" width="22" height="18" rx="4" fill="#2563eb"/><text x="71" y="147" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="90" y="147" font-size="12.5" font-weight="700" fill="#16324f">Cadrage &amp; conception</text>
    <text x="456" y="147" text-anchor="end" font-size="9.5" fill="#6e6e73">nov.–déc. 2025</text>
    <line x1="60" y1="156" x2="456" y2="156" stroke="#eef1f4" stroke-width="1"/>
    <text x="62" y="172" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">1.1</tspan>  Analyse du besoin &amp; reformulation de la demande</text>
    <text x="62" y="188" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">1.2</tspan>  Étude de marché &amp; modèle d'affaires</text>
    <text x="62" y="204" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">1.3</tspan>  Choix techniques (ADR) &amp; cahier des charges</text>
    <text x="62" y="220" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">1.4</tspan>  Modélisation UML, MCD / MLD</text>
    <text x="62" y="236" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">1.5</tspan>  Architecture C4 &amp; découpage en modules</text>
  </g>

  <!-- P2 -->
  <line x1="30" y1="310" x2="46" y2="310" stroke="#c7c7cc" stroke-width="1.5"/>
  <g>
    <rect x="46" y="258" width="424" height="104" rx="9" fill="#ffffff" stroke="#d7dae0"/>
    <rect x="60" y="268" width="22" height="18" rx="4" fill="#2563eb"/><text x="71" y="281" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="90" y="281" font-size="12.5" font-weight="700" fill="#16324f">Incrément 1 — socle</text>
    <text x="456" y="281" text-anchor="end" font-size="9.5" fill="#6e6e73">janv. 2026</text>
    <line x1="60" y1="290" x2="456" y2="290" stroke="#eef1f4" stroke-width="1"/>
    <text x="62" y="306" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">2.1</tspan>  Multi-locataire &amp; contrôle d'accès (RBAC)</text>
    <text x="62" y="322" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">2.2</tspan>  Authentification Keycloak (OIDC)</text>
    <text x="62" y="338" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">2.3</tspan>  Persistance &amp; migrations Flyway</text>
    <text x="62" y="354" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">2.4</tspan>  Sécurité en profondeur (chiffrement, audit)</text>
  </g>

  <!-- P3 -->
  <line x1="30" y1="428" x2="46" y2="428" stroke="#c7c7cc" stroke-width="1.5"/>
  <g>
    <rect x="46" y="376" width="424" height="104" rx="9" fill="#ffffff" stroke="#d7dae0"/>
    <rect x="60" y="386" width="22" height="18" rx="4" fill="#f48120"/><text x="71" y="399" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="90" y="399" font-size="12.5" font-weight="700" fill="#16324f">Incrément 2 — métier &amp; smart-assign</text>
    <text x="456" y="399" text-anchor="end" font-size="9.5" fill="#6e6e73">févr.–avr. 2026</text>
    <line x1="60" y1="408" x2="456" y2="408" stroke="#eef1f4" stroke-width="1"/>
    <text x="62" y="424" font-size="10.5" fill="#1d1d1f"><tspan fill="#f48120" font-weight="700">3.1</tspan>  Projets, tâches, cycles</text>
    <text x="62" y="440" font-size="10.5" fill="#1d1d1f"><tspan fill="#f48120" font-weight="700">3.2</tspan>  Profils de compétences &amp; embeddings</text>
    <text x="62" y="456" font-size="10.5" fill="#1d1d1f"><tspan fill="#f48120" font-weight="700">3.3</tspan>  Pré-filtre &amp; scoring, service IA (passerelle)</text>
    <text x="62" y="472" font-size="10.5" fill="#1d1d1f"><tspan fill="#f48120" font-weight="700">3.4</tspan>  Redistribution de charge</text>
  </g>

  <!-- P4 -->
  <line x1="30" y1="546" x2="46" y2="546" stroke="#c7c7cc" stroke-width="1.5"/>
  <g>
    <rect x="46" y="494" width="424" height="104" rx="9" fill="#ffffff" stroke="#d7dae0"/>
    <rect x="60" y="504" width="22" height="18" rx="4" fill="#2563eb"/><text x="71" y="517" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
    <text x="90" y="517" font-size="12.5" font-weight="700" fill="#16324f">Incrément 3 — produit</text>
    <text x="456" y="517" text-anchor="end" font-size="9.5" fill="#6e6e73">mai–juin 2026</text>
    <line x1="60" y1="526" x2="456" y2="526" stroke="#eef1f4" stroke-width="1"/>
    <text x="62" y="542" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">4.1</tspan>  Front (onboarding, tableau de bord, vues)</text>
    <text x="62" y="558" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">4.2</tspan>  Paiement &amp; monétisation (Stripe)</text>
    <text x="62" y="574" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">4.3</tspan>  API REST &amp; OpenAPI, intégrations / MCP</text>
    <text x="62" y="590" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">4.4</tspan>  Gel des fonctionnalités (20 juin)</text>
  </g>

  <!-- ===== COLUMN B ===== -->
  <!-- P5 -->
  <line x1="496" y1="168" x2="512" y2="168" stroke="#c7c7cc" stroke-width="1.5"/>
  <g>
    <rect x="512" y="124" width="424" height="88" rx="9" fill="#ffffff" stroke="#d7dae0"/>
    <rect x="526" y="134" width="22" height="18" rx="4" fill="#34c759"/><text x="537" y="147" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
    <text x="556" y="147" font-size="12.5" font-weight="700" fill="#16324f">Tests, qualité &amp; sécurité</text>
    <text x="922" y="147" text-anchor="end" font-size="9.5" fill="#6e6e73">continu → juil. 2026</text>
    <line x1="526" y1="156" x2="922" y2="156" stroke="#eef1f4" stroke-width="1"/>
    <text x="528" y="172" font-size="10.5" fill="#1d1d1f"><tspan fill="#34c759" font-weight="700">5.1</tspan>  Tests unitaires &amp; d'intégration (Vitest, JUnit)</text>
    <text x="528" y="188" font-size="10.5" fill="#1d1d1f"><tspan fill="#34c759" font-weight="700">5.2</tspan>  Tests de bout en bout (Playwright) &amp; recette</text>
    <text x="528" y="204" font-size="10.5" fill="#1d1d1f"><tspan fill="#34c759" font-weight="700">5.3</tspan>  Analyses SAST / SCA / DAST (Semgrep, Trivy, ZAP)</text>
  </g>

  <!-- P6 -->
  <line x1="496" y1="270" x2="512" y2="270" stroke="#c7c7cc" stroke-width="1.5"/>
  <g>
    <rect x="512" y="226" width="424" height="88" rx="9" fill="#ffffff" stroke="#d7dae0"/>
    <rect x="526" y="236" width="22" height="18" rx="4" fill="#2563eb"/><text x="537" y="249" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
    <text x="556" y="249" font-size="12.5" font-weight="700" fill="#16324f">Déploiement &amp; industrialisation</text>
    <text x="922" y="249" text-anchor="end" font-size="9.5" fill="#6e6e73">août 2026</text>
    <line x1="526" y1="258" x2="922" y2="258" stroke="#eef1f4" stroke-width="1"/>
    <text x="528" y="274" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">6.1</tspan>  Conteneurisation prod, CI/CD &amp; registre GHCR</text>
    <text x="528" y="290" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">6.2</tspan>  Déploiement 2 VM + tunnel Cloudflare</text>
    <text x="528" y="306" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">6.3</tspan>  Supervision (Prometheus / Grafana) &amp; sauvegarde</text>
  </g>

  <!-- P7 -->
  <line x1="496" y1="380" x2="512" y2="380" stroke="#c7c7cc" stroke-width="1.5"/>
  <g>
    <rect x="512" y="328" width="424" height="104" rx="9" fill="#ffffff" stroke="#d7dae0"/>
    <rect x="526" y="338" width="22" height="18" rx="4" fill="#2563eb"/><text x="537" y="351" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text>
    <text x="556" y="351" font-size="12.5" font-weight="700" fill="#16324f">Documentation &amp; soutenance</text>
    <text x="922" y="351" text-anchor="end" font-size="9.5" fill="#6e6e73">juil.–août 2026</text>
    <line x1="526" y1="360" x2="922" y2="360" stroke="#eef1f4" stroke-width="1"/>
    <text x="528" y="376" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">7.1</tspan>  Manuel utilisateur &amp; référence API (Fern)</text>
    <text x="528" y="392" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">7.2</tspan>  Brain OS (documentation tenue comme du code)</text>
    <text x="528" y="408" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">7.3</tspan>  Dossier de validation</text>
    <text x="528" y="424" font-size="10.5" fill="#1d1d1f"><tspan fill="#2563eb" font-weight="700">7.4</tspan>  Présentation de synthèse &amp; soutenance</text>
  </g>
</svg>
