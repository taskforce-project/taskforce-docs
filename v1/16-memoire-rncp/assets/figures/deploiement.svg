<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="tri" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="16" font-weight="700" fill="#1d1d1f">Schéma de déploiement : deux machines derrière un tunnel Cloudflare</text>
  <text x="20" y="42" font-size="11.5" fill="#6e6e73">Aucun port entrant · tunnel sortant (cloudflared) · maillage privé Tailscale · domaine taskforce-project.fr</text>

  <!-- top row : user, cloudflare, vercel -->
  <rect x="40" y="72" width="120" height="34" rx="9" fill="#2563eb"/>
  <text x="100" y="94" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">Utilisateur</text>

  <rect x="310" y="66" width="230" height="46" rx="10" fill="#f2f2f4" stroke="#cfcfd4"/>
  <text x="425" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">Cloudflare</text>
  <text x="425" y="102" text-anchor="middle" font-size="10.5" fill="#6e6e73">bord · TLS · tunnel</text>

  <rect x="710" y="70" width="140" height="40" rx="10" fill="#f2f2f4" stroke="#cfcfd4"/>
  <text x="780" y="88" text-anchor="middle" font-size="12" fill="#6e6e73">Vercel</text>
  <text x="780" y="103" text-anchor="middle" font-size="10.5" fill="#6e6e73">vitrine Astro</text>

  <line x1="160" y1="89" x2="304" y2="89" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#tri)"/>
  <line x1="540" y1="89" x2="704" y2="89" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#tri)"/>
  <text x="622" y="82" text-anchor="middle" font-size="10" fill="#6e6e73">www · docs</text>

  <!-- routing arrows to VMs -->
  <line x1="380" y1="112" x2="210" y2="186" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#tri)"/>
  <text x="250" y="150" text-anchor="middle" font-size="10" fill="#2563eb">api. · auth.</text>
  <line x1="470" y1="112" x2="650" y2="186" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#tri)"/>
  <text x="600" y="150" text-anchor="middle" font-size="10" fill="#2563eb">app.</text>

  <!-- VM 1 -->
  <rect x="40" y="190" width="380" height="250" rx="12" fill="#fbfbfc" stroke="#d7dae0"/>
  <text x="58" y="214" font-size="13" font-weight="700" fill="#1d1d1f">VM 1 — backend &amp; données</text>
  <text x="58" y="230" font-size="10.5" fill="#6e6e73">100.122.50.25 · Debian · 2 vCPU · 3,8 Gio</text>

  <rect x="58" y="240" width="176" height="30" rx="6" fill="#ffffff" stroke="#d7dae0"/><text x="146" y="259" text-anchor="middle" font-size="11" fill="#1d1d1f">Backend (Spring Boot)</text>
  <rect x="244" y="240" width="158" height="30" rx="6" fill="#ffffff" stroke="#d7dae0"/><text x="323" y="259" text-anchor="middle" font-size="11" fill="#1d1d1f">Keycloak</text>
  <rect x="58" y="278" width="176" height="30" rx="6" fill="#eef3f8" stroke="#b8c2cc"/><text x="146" y="297" text-anchor="middle" font-size="11" fill="#1d1d1f">PostgreSQL + pgvector</text>
  <rect x="244" y="278" width="158" height="30" rx="6" fill="#ffffff" stroke="#d7dae0"/><text x="323" y="297" text-anchor="middle" font-size="11" fill="#1d1d1f">Service IA (Python)</text>
  <rect x="58" y="316" width="176" height="30" rx="6" fill="#ffffff" stroke="#d7dae0"/><text x="146" y="335" text-anchor="middle" font-size="11" fill="#1d1d1f">MinIO</text>
  <rect x="244" y="316" width="158" height="30" rx="6" fill="#ffffff" stroke="#d7dae0"/><text x="323" y="335" text-anchor="middle" font-size="11" fill="#1d1d1f">Redis</text>
  <rect x="58" y="354" width="176" height="30" rx="6" fill="#fff4ec" stroke="#f2c9a6"/><text x="146" y="373" text-anchor="middle" font-size="11" fill="#b5560f">cloudflared</text>
  <rect x="244" y="354" width="158" height="30" rx="6" fill="#ffffff" stroke="#d7dae0"/><text x="323" y="373" text-anchor="middle" font-size="10.5" fill="#6e6e73">Sondes (métriques)</text>

  <!-- VM 2 -->
  <rect x="460" y="190" width="380" height="250" rx="12" fill="#fbfbfc" stroke="#d7dae0"/>
  <text x="478" y="214" font-size="13" font-weight="700" fill="#1d1d1f">VM 2 — front &amp; supervision</text>
  <text x="478" y="230" font-size="10.5" fill="#6e6e73">100.120.222.10 · Debian · 2 vCPU · 3,8 Gio</text>

  <rect x="478" y="240" width="176" height="30" rx="6" fill="#ffffff" stroke="#d7dae0"/><text x="566" y="259" text-anchor="middle" font-size="11" fill="#1d1d1f">Front-end (Next.js)</text>
  <rect x="664" y="240" width="158" height="30" rx="6" fill="#ffffff" stroke="#d7dae0"/><text x="743" y="259" text-anchor="middle" font-size="11" fill="#1d1d1f">Vitrine (nginx)</text>
  <rect x="478" y="278" width="176" height="30" rx="6" fill="#ffffff" stroke="#d7dae0"/><text x="566" y="297" text-anchor="middle" font-size="11" fill="#1d1d1f">Prometheus</text>
  <rect x="664" y="278" width="158" height="30" rx="6" fill="#ffffff" stroke="#d7dae0"/><text x="743" y="297" text-anchor="middle" font-size="11" fill="#1d1d1f">Grafana</text>
  <rect x="478" y="316" width="176" height="30" rx="6" fill="#ffffff" stroke="#d7dae0"/><text x="566" y="335" text-anchor="middle" font-size="11" fill="#1d1d1f">Umami</text>
  <rect x="664" y="316" width="158" height="30" rx="6" fill="#fff4ec" stroke="#f2c9a6"/><text x="743" y="335" text-anchor="middle" font-size="11" fill="#b5560f">cloudflared</text>
  <rect x="478" y="354" width="176" height="30" rx="6" fill="#ffffff" stroke="#d7dae0"/><text x="566" y="373" text-anchor="middle" font-size="10.5" fill="#6e6e73">Sondes (métriques)</text>

  <!-- Tailscale link between VMs -->
  <line x1="420" y1="315" x2="460" y2="315" stroke="#34c759" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="440" y="306" text-anchor="middle" font-size="9" fill="#2a9d54">Tailscale</text>

  <!-- footnotes -->
  <text x="20" y="470" font-size="11" fill="#6e6e73">Le trafic descend par un tunnel que chaque machine ouvre en sortie (cloudflared) ; aucun port entrant n'est exposé, et le chiffrement TLS est terminé au bord de Cloudflare.</text>
  <text x="20" y="490" font-size="11" fill="#6e6e73">Les deux machines communiquent en privé par Tailscale : la supervision (VM 2) interroge le back-end (VM 1) par ce maillage. La vitrine Astro est publiée séparément sur Vercel.</text>
</svg>
