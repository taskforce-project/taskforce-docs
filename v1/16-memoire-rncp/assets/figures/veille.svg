<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a1a1a6"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f48120"/>
    </marker>
  </defs>

  <!-- ===== Sources de veille ===== -->
  <rect x="24" y="56" width="196" height="410" rx="10" fill="#ffffff" stroke="#e6e6e9"/>
  <text x="122" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Sources de veille</text>
  <text x="122" y="102" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6e6e73">(sélection, non exhaustif)</text>
  <line x1="42" y1="114" x2="202" y2="114" stroke="#e6e6e9"/>
  <text x="42" y="144" font-size="12.5" fill="#3a3a3c">Canaux officiels · CVE / NVD</text>
  <text x="42" y="186" font-size="12.5" fill="#3a3a3c">OWASP · ANSSI · CNIL</text>
  <text x="42" y="228" font-size="12.5" fill="#3a3a3c">LinkedIn · infolettres</text>
  <text x="42" y="270" font-size="12.5" fill="#3a3a3c">Oracle · IBM · Microsoft</text>
  <text x="42" y="312" font-size="12.5" fill="#3a3a3c">Apple · Ollama</text>
  <text x="42" y="354" font-size="12.5" fill="#3a3a3c">Daily Dev · Seven Gold</text>
  <text x="42" y="396" font-size="12.5" fill="#3a3a3c">Ouvrages (Mastra) · …</text>

  <!-- Sources -> Veilleur -->
  <line x1="220" y1="260" x2="246" y2="260" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== Le veilleur (primaire) ===== -->
  <rect x="248" y="214" width="122" height="92" rx="46" fill="#2563eb"/>
  <text x="309" y="254" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Le veilleur</text>
  <text x="309" y="275" text-anchor="middle" font-size="10.5" fill="#dbe6fb">collecte · tri</text>
  <text x="309" y="290" text-anchor="middle" font-size="10.5" fill="#dbe6fb">évaluation</text>

  <!-- Veilleur -> cluster -->
  <line x1="370" y1="260" x2="400" y2="260" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== Raisonnement multi-angles ===== -->
  <rect x="402" y="92" width="258" height="356" rx="12" fill="none" stroke="#cfcfd4" stroke-dasharray="5 4"/>
  <text x="531" y="116" text-anchor="middle" font-size="13" font-style="italic" fill="#6e6e73">Raisonnement multi-angles</text>
  <text x="531" y="135" text-anchor="middle" font-size="10.5" fill="#8a8a8e">technique · sécurité · conformité</text>
  <text x="531" y="151" text-anchor="middle" font-size="10.5" fill="#8a8a8e">scalabilité · valeur</text>

  <rect x="424" y="170" width="214" height="76" rx="10" fill="#ffffff" stroke="#e6e6e9"/>
  <text x="531" y="202" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d1d1f">Agent IA</text>
  <text x="531" y="224" text-anchor="middle" font-size="12" fill="#6e6e73">discussion approfondie</text>

  <line x1="531" y1="246" x2="531" y2="300" stroke="#a1a1a6" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="545" y="277" font-size="10.5" fill="#8a8a8e">confronter</text>

  <rect x="424" y="300" width="214" height="120" rx="10" fill="#ffffff" stroke="#e6e6e9"/>
  <text x="531" y="334" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d1d1f">Brain OS</text>
  <text x="531" y="358" text-anchor="middle" font-size="12" fill="#3a3a3c">ADR + spécifications</text>
  <text x="531" y="384" text-anchor="middle" font-size="11.5" fill="#6e6e73">contexte du projet</text>

  <!-- cluster -> Décision -->
  <line x1="660" y1="262" x2="692" y2="262" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== Décision structurante (bordure primaire) ===== -->
  <rect x="694" y="216" width="152" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="770" y="248" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2563eb">Décision</text>
  <text x="770" y="269" text-anchor="middle" font-size="12.5" fill="#2563eb">structurante</text>
  <text x="770" y="292" text-anchor="middle" font-size="10" fill="#6e6e73">raisonnement + approbation</text>

  <!-- Décision -> ADR consigné (voie normale) -->
  <path d="M846,238 C 880,214 880,176 862,158" fill="none" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="864" y="104" width="156" height="74" rx="10" fill="#ffffff" stroke="#e6e6e9"/>
  <text x="942" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#1d1d1f">ADR consigné</text>
  <text x="942" y="158" text-anchor="middle" font-size="11" fill="#6e6e73">journal des décisions</text>

  <!-- Décision -> ADR + dette (voie contrainte, orange) -->
  <path d="M846,292 C 878,320 880,364 866,394" fill="none" stroke="#f48120" stroke-width="1.6" marker-end="url(#arrO)"/>
  <text x="852" y="338" font-size="10.5" font-style="italic" fill="#b45309">solution courte</text>
  <rect x="852" y="392" width="176" height="112" rx="10" fill="#fdf1e7" stroke="#f48120"/>
  <text x="940" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">ADR consigné</text>
  <text x="940" y="442" text-anchor="middle" font-size="11.5" fill="#b45309">+ registre de dette technique</text>
  <text x="940" y="470" text-anchor="middle" font-size="11" fill="#9a5a2a">à lever plus tard</text>
  <text x="940" y="488" text-anchor="middle" font-size="10.5" fill="#9a5a2a">(temps, moyens…)</text>
</svg>
