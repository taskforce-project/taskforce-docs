<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <defs>
    <marker id="tri" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="16" font-weight="700" fill="#1d1d1f">Analyse du besoin : la « bête à cornes »</text>

  <!-- left horn : à qui -->
  <rect x="40" y="62" width="308" height="96" rx="12" fill="#ffffff" stroke="#d7dae0"/>
  <text x="60" y="88" font-size="12.5" font-weight="700" fill="#2563eb">À qui le produit rend-il service ?</text>
  <text x="60" y="112" font-size="12" fill="#1d1d1f">Aux responsables qui répartissent le travail</text>
  <text x="60" y="132" font-size="12" fill="#1d1d1f">et aux membres des équipes qui le reçoivent.</text>

  <!-- right horn : sur quoi -->
  <rect x="412" y="62" width="308" height="96" rx="12" fill="#ffffff" stroke="#d7dae0"/>
  <text x="432" y="88" font-size="12.5" font-weight="700" fill="#2563eb">Sur quoi le produit agit-il ?</text>
  <text x="432" y="112" font-size="12" fill="#1d1d1f">Sur la décision d'affectation des tâches :</text>
  <text x="432" y="132" font-size="12" fill="#1d1d1f">compétences, charge et disponibilité.</text>

  <!-- center : product -->
  <rect x="298" y="228" width="164" height="64" rx="12" fill="#2563eb"/>
  <text x="380" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">TaskForce</text>
  <text x="380" y="276" text-anchor="middle" font-size="10.5" fill="#dbe6fb">aide à la décision d'affectation</text>

  <!-- arrows from product to horns -->
  <line x1="320" y1="228" x2="215" y2="160" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#tri)"/>
  <line x1="440" y1="228" x2="545" y2="160" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#tri)"/>

  <!-- bottom : but -->
  <line x1="380" y1="292" x2="380" y2="356" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#tri)"/>
  <rect x="150" y="360" width="460" height="104" rx="12" fill="#eef3f8" stroke="#b8c2cc"/>
  <text x="380" y="386" text-anchor="middle" font-size="12.5" font-weight="700" fill="#33475b">Dans quel but ?</text>
  <text x="380" y="410" text-anchor="middle" font-size="12" fill="#1d1d1f">Optimiser l'affectation : la bonne tâche à la bonne personne,</text>
  <text x="380" y="430" text-anchor="middle" font-size="12" fill="#1d1d1f">une charge équilibrée et une décision justifiée et tracée,</text>
  <text x="380" y="450" text-anchor="middle" font-size="12" fill="#1d1d1f">là où elle est aujourd'hui laissée à l'intuition.</text>

  <!-- validation -->
  <text x="20" y="498" font-size="11" fill="#6e6e73">Le besoin ne risque pas de disparaître : la coordination reste un coût structurel de toute équipe qui grandit, et aucun outil installé n'outille cette décision.</text>
</svg>
