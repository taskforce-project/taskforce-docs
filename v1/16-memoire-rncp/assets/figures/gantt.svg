<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="920" height="400" fill="#ffffff"/>

  <text x="20" y="28" font-size="16" font-weight="700" fill="#1d1d1f">Planning du projet : cinq phases, six jalons</text>
  <text x="20" y="46" font-size="11.5" fill="#6e6e73">novembre 2025 - août 2026 (dix mois) · environ 71 jours-homme valorisés</text>

  <!-- month gridlines + labels -->
  <g font-size="10.5" fill="#6e6e73" text-anchor="middle">
    <line x1="190" y1="66" x2="190" y2="300" stroke="#eef0f2"/>
    <line x1="262" y1="66" x2="262" y2="300" stroke="#eef0f2"/>
    <line x1="334" y1="66" x2="334" y2="300" stroke="#eef0f2"/>
    <line x1="406" y1="66" x2="406" y2="300" stroke="#eef0f2"/>
    <line x1="478" y1="66" x2="478" y2="300" stroke="#eef0f2"/>
    <line x1="550" y1="66" x2="550" y2="300" stroke="#eef0f2"/>
    <line x1="622" y1="66" x2="622" y2="300" stroke="#eef0f2"/>
    <line x1="694" y1="66" x2="694" y2="300" stroke="#eef0f2"/>
    <line x1="766" y1="66" x2="766" y2="300" stroke="#eef0f2"/>
    <line x1="838" y1="66" x2="838" y2="300" stroke="#eef0f2"/>
    <line x1="910" y1="66" x2="910" y2="300" stroke="#eef0f2"/>
    <text x="226" y="78">nov.</text>
    <text x="298" y="78">déc.</text>
    <text x="370" y="78">janv.</text>
    <text x="442" y="78">févr.</text>
    <text x="514" y="78">mars</text>
    <text x="586" y="78">avr.</text>
    <text x="658" y="78">mai</text>
    <text x="730" y="78">juin</text>
    <text x="802" y="78">juil.</text>
    <text x="874" y="78">août</text>
  </g>

  <!-- phase bars -->
  <!-- Cadrage & conception : nov-déc -->
  <text x="178" y="104" text-anchor="end" font-size="12" fill="#3a3a3c">Cadrage &amp; conception</text>
  <rect x="190" y="92" width="144" height="22" rx="5" fill="#a1a1a6"/>

  <!-- Développement M1-M3 : janv-mars -->
  <text x="178" y="140" text-anchor="end" font-size="12" fill="#3a3a3c">Développement</text>
  <rect x="334" y="128" width="70" height="22" rx="5" fill="#2563eb"/>
  <rect x="406" y="128" width="70" height="22" rx="5" fill="#2563eb"/>
  <rect x="478" y="128" width="70" height="22" rx="5" fill="#2563eb"/>
  <text x="369" y="143" text-anchor="middle" font-size="10" fill="#ffffff">M1</text>
  <text x="441" y="143" text-anchor="middle" font-size="10" fill="#ffffff">M2</text>
  <text x="513" y="143" text-anchor="middle" font-size="10" fill="#ffffff">M3</text>

  <!-- Tests & qualité : avr - 20 juin -->
  <text x="178" y="176" text-anchor="end" font-size="12" fill="#3a3a3c">Tests &amp; qualité</text>
  <rect x="550" y="164" width="192" height="22" rx="5" fill="#6e6e73"/>

  <!-- Déploiement : juil - mi-août -->
  <text x="178" y="212" text-anchor="end" font-size="12" fill="#3a3a3c">Déploiement</text>
  <rect x="766" y="200" width="108" height="22" rx="5" fill="#34c759"/>

  <!-- Documentation : 20 juin - fin août -->
  <text x="178" y="248" text-anchor="end" font-size="12" fill="#3a3a3c">Documentation</text>
  <rect x="742" y="236" width="168" height="22" rx="5" fill="#bcd0f7"/>

  <!-- milestones lane -->
  <line x1="190" y1="292" x2="910" y2="292" stroke="#d7dae0" stroke-width="1"/>
  <g font-size="9" fill="#6e6e73" text-anchor="middle">
    <!-- J1 Core 31/01 -->
    <path d="M406,286 l6,6 l-6,6 l-6,-6 z" fill="#f48120"/>
    <text x="406" y="281" font-size="9.5" font-weight="700" fill="#b5560f">J1</text>
    <text x="406" y="312">Core · 31/01</text>
    <!-- J2 SaaS 28/02 -->
    <path d="M478,286 l6,6 l-6,6 l-6,-6 z" fill="#f48120"/>
    <text x="478" y="281" font-size="9.5" font-weight="700" fill="#b5560f">J2</text>
    <text x="478" y="312">SaaS · 28/02</text>
    <!-- J3 RGPD 28/03 -->
    <path d="M550,286 l6,6 l-6,6 l-6,-6 z" fill="#f48120"/>
    <text x="550" y="281" font-size="9.5" font-weight="700" fill="#b5560f">J3</text>
    <text x="550" y="312">RGPD · 28/03</text>
    <!-- J4 Tests 26/04 -->
    <path d="M612,286 l6,6 l-6,6 l-6,-6 z" fill="#f48120"/>
    <text x="612" y="281" font-size="9.5" font-weight="700" fill="#b5560f">J4</text>
    <text x="612" y="312">Tests · 26/04</text>
    <!-- J5 Freeze 20/06 -->
    <path d="M742,286 l6,6 l-6,6 l-6,-6 z" fill="#f48120"/>
    <text x="742" y="281" font-size="9.5" font-weight="700" fill="#b5560f">J5</text>
    <text x="742" y="312">Gel · 20/06</text>
    <!-- J6 Soutenance fin août -->
    <path d="M900,286 l6,6 l-6,6 l-6,-6 z" fill="#2563eb"/>
    <text x="900" y="281" font-size="9.5" font-weight="700" fill="#2563eb">J6</text>
    <text x="895" y="312">Soutenance</text>
  </g>

  <!-- note chemin critique -->
  <text x="20" y="360" font-size="11" fill="#6e6e73">Chemin critique linéaire et sans marge : tout retard sur la chaîne cadrage - conception - développement - tests - documentation décale la soutenance.</text>
  <text x="20" y="378" font-size="11" fill="#6e6e73">Les tâches périphériques (intégrations, alertes, retouches d'interface) sont tenues hors du chemin critique, avec une à deux semaines de marge.</text>
</svg>
