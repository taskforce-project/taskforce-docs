<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>TaskForce v2 : architecture du harnais</title>
  <defs>
    <marker id="fin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44546a"/>
    </marker>
    <style>
      .cadre { fill: #f4f6f9; stroke: #cfd6e0; stroke-width: 1.5; }
      .module { fill: #ffffff; stroke: #9aa6b8; stroke-width: 1.2; }
      .harnais { fill: #eaf1ff; stroke: #2f63d0; stroke-width: 1.6; }
      .externe { fill: #fbfbfc; stroke: #9aa6b8; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .produit { fill: #ffffff; stroke: #172033; stroke-width: 1.4; }
      .titre { font-size: 15px; font-weight: 600; fill: #172033; }
      .titre-h { font-size: 15px; font-weight: 600; fill: #1f4fb3; }
      .sous { font-size: 12px; fill: #5b6678; }
      .cadre-t { font-size: 16px; font-weight: 700; fill: #172033; }
      .note { font-size: 11.5px; fill: #44546a; }
      .flux { stroke: #44546a; stroke-width: 1.6; fill: none; marker-end: url(#fin); }
      .flux2 { stroke: #44546a; stroke-width: 1.6; fill: none; marker-end: url(#fin); marker-start: url(#fin); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>
  <text x="40" y="36" font-size="19" font-weight="700" fill="#172033">TaskForce v2 : architecture du harnais</text>

  <!-- Produits -->
  <rect class="produit" x="40" y="58" width="300" height="64" rx="8"/>
  <text class="titre" x="190" y="85" text-anchor="middle">Webapp</text>
  <text class="sous" x="190" y="105" text-anchor="middle">navigateur ; porte aussi l'API</text>

  <rect class="produit" x="380" y="58" width="360" height="64" rx="8"/>
  <text class="titre" x="560" y="85" text-anchor="middle">App desktop</text>
  <text class="sous" x="560" y="105" text-anchor="middle">.exe puis Microsoft Store ; panneau de contexte, / et @</text>

  <!-- Serveur TaskForce -->
  <rect class="cadre" x="40" y="160" width="700" height="450" rx="12"/>
  <text class="cadre-t" x="58" y="186">Serveur TaskForce : monolithe modulaire Spring Boot</text>
  <text class="sous" x="58" y="205">hébergé (webapp, espaces d'équipe) ou embarqué (espaces locaux de l'app)</text>

  <rect class="module" x="58" y="222" width="155" height="72" rx="6"/>
  <text class="titre" x="135.5" y="250" text-anchor="middle">Identité, équipes</text>
  <text class="sous" x="135.5" y="270" text-anchor="middle">rôles, matrice RACI</text>

  <rect class="module" x="225" y="222" width="155" height="72" rx="6"/>
  <text class="titre" x="302.5" y="250" text-anchor="middle">Projets, missions</text>
  <text class="sous" x="302.5" y="270" text-anchor="middle">issues, file, baux</text>

  <rect class="harnais" x="392" y="222" width="155" height="72" rx="6"/>
  <text class="titre-h" x="469.5" y="250" text-anchor="middle">Contexte</text>
  <text class="sous" x="469.5" y="270" text-anchor="middle">documents, versions,</text>
  <text class="sous" x="469.5" y="285" text-anchor="middle">recherche, écart</text>

  <rect class="harnais" x="559" y="222" width="155" height="72" rx="6"/>
  <text class="titre-h" x="636.5" y="250" text-anchor="middle">Règles</text>
  <text class="sous" x="636.5" y="270" text-anchor="middle">paquets versionnés,</text>
  <text class="sous" x="636.5" y="285" text-anchor="middle">classes, compteurs</text>

  <rect class="module" x="58" y="310" width="155" height="72" rx="6"/>
  <text class="titre" x="135.5" y="338" text-anchor="middle">Fil de l'équipe</text>
  <text class="sous" x="135.5" y="358" text-anchor="middle">temps réel</text>

  <rect class="harnais" x="225" y="310" width="155" height="72" rx="6"/>
  <text class="titre-h" x="302.5" y="338" text-anchor="middle">Preuve</text>
  <text class="sous" x="302.5" y="358" text-anchor="middle">journal chaîné, export</text>

  <rect class="module" x="392" y="310" width="155" height="72" rx="6"/>
  <text class="titre" x="469.5" y="338" text-anchor="middle">Connecteurs</text>
  <text class="sous" x="469.5" y="358" text-anchor="middle">MCP, OpenAPI, natifs</text>

  <rect class="harnais" x="559" y="310" width="155" height="72" rx="6"/>
  <text class="titre-h" x="636.5" y="338" text-anchor="middle">Porte</text>
  <text class="sous" x="636.5" y="358" text-anchor="middle">serveur MCP,</text>
  <text class="sous" x="636.5" y="373" text-anchor="middle">outils relayés</text>

  <rect class="module" x="58" y="400" width="322" height="56" rx="6"/>
  <text class="titre" x="219" y="425" text-anchor="middle">PostgreSQL et pgvector</text>
  <text class="sous" x="219" y="444" text-anchor="middle">missions, règles, preuves, passages</text>

  <rect class="harnais" x="559" y="400" width="155" height="64" rx="6"/>
  <text class="titre-h" x="636.5" y="425" text-anchor="middle">Juge, relecteur</text>
  <text class="sous" x="636.5" y="444" text-anchor="middle">autre modèle, sans outil,</text>
  <text class="sous" x="636.5" y="458" text-anchor="middle">propose, ne décide pas</text>

  <rect class="module" x="58" y="470" width="322" height="50" rx="6"/>
  <text class="titre" x="219" y="492" text-anchor="middle">Fichiers</text>
  <text class="sous" x="219" y="510" text-anchor="middle">MinIO, ou dossier de l'app</text>

  <rect class="harnais" x="559" y="478" width="155" height="56" rx="6"/>
  <text class="titre-h" x="636.5" y="502" text-anchor="middle">Coffre</text>
  <text class="sous" x="636.5" y="521" text-anchor="middle">secrets, jamais montrés</text>

  <text class="note" x="58" y="548">Tracer avant d'agir : intention, action, résultat.</text>
  <text class="note" x="58" y="565">Deux gardes, une seule table : le runner juge</text>
  <text class="note" x="58" y="582">les actions locales, la porte juge les outils.</text>
  <text class="note" x="58" y="599">Aucun modèle d'IA ne décide d'une règle.</text>

  <!-- Ordinateur de la personne -->
  <rect class="cadre" x="830" y="160" width="330" height="450" rx="12"/>
  <text class="cadre-t" x="848" y="186">Ordinateur de la personne</text>
  <text class="sous" x="848" y="205">lancé et tenu par l'app desktop</text>

  <rect class="module" x="848" y="222" width="294" height="64" rx="6"/>
  <text class="titre" x="995" y="249" text-anchor="middle">Runner</text>
  <text class="sous" x="995" y="268" text-anchor="middle">règles jugées sur place, journal local</text>

  <rect class="module" x="848" y="310" width="294" height="64" rx="6"/>
  <text class="titre" x="995" y="337" text-anchor="middle">Agent</text>
  <text class="sous" x="995" y="356" text-anchor="middle">Claude Code, boucle interne, Codex</text>

  <rect class="harnais" x="848" y="400" width="140" height="64" rx="6"/>
  <text class="titre-h" x="918" y="427" text-anchor="middle">Bac à sable</text>
  <text class="sous" x="918" y="446" text-anchor="middle">copie, tests</text>

  <rect class="module" x="1002" y="400" width="140" height="64" rx="6"/>
  <text class="titre" x="1072" y="427" text-anchor="middle">Modèles locaux</text>
  <text class="sous" x="1072" y="446" text-anchor="middle">Ollama, par tâche</text>

  <rect class="harnais" x="848" y="486" width="294" height="56" rx="6"/>
  <text class="titre-h" x="995" y="510" text-anchor="middle">Aperçu des effets</text>
  <text class="sous" x="995" y="529" text-anchor="middle">plan, diff, exécution à blanc, avant la décision</text>

  <text class="note" x="848" y="572">Un petit modèle local doit suffire à tout ou</text>
  <text class="note" x="848" y="589">partie des tâches : la décision vit dans l'architecture.</text>

  <!-- Externes -->
  <rect class="externe" x="330" y="650" width="280" height="64" rx="8"/>
  <text class="titre" x="470" y="677" text-anchor="middle">Outils de l'entreprise</text>
  <text class="sous" x="470" y="696" text-anchor="middle">agenda, CRM, paiement, dépôts...</text>

  <rect class="externe" x="848" y="650" width="294" height="64" rx="8"/>
  <text class="titre" x="995" y="677" text-anchor="middle">Modèles dans le cloud</text>
  <text class="sous" x="995" y="696" text-anchor="middle">fournisseurs d'IA</text>

  <!-- Flux -->
  <line class="flux" x1="190" y1="122" x2="190" y2="158"/>
  <line class="flux" x1="560" y1="122" x2="560" y2="158"/>
  <text class="note" x="568" y="146">espace local embarqué, ou espace d'équipe (A)</text>
  <polyline class="flux" points="740,90 995,90 995,158"/>
  <text class="note" x="830" y="82">lance le runner</text>

  <line class="flux2" x1="846" y1="262" x2="716" y2="262"/>
  <text class="note" x="785" y="231" text-anchor="middle">missions</text>
  <text class="note" x="785" y="244" text-anchor="middle">règles</text>
  <text class="note" x="785" y="257" text-anchor="middle">trace</text>

  <line class="flux" x1="846" y1="346" x2="716" y2="346"/>
  <text class="note" x="785" y="338" text-anchor="middle">outils (MCP)</text>

  <line class="flux2" x1="636.5" y1="384" x2="636.5" y2="398"/>

  <line class="flux" x1="995" y1="286" x2="995" y2="308"/>
  <line class="flux" x1="940" y1="374" x2="918" y2="398"/>
  <line class="flux" x1="1050" y1="374" x2="1072" y2="398"/>
  <line class="flux" x1="918" y1="464" x2="918" y2="484"/>
  <polyline class="flux" points="1142,342 1180,342 1180,682 1144,682"/>

  <line class="flux" x1="469.5" y1="382" x2="469.5" y2="648"/>
  <text class="note" x="478" y="636">jetons gardés au serveur</text>

  <!-- Légende -->
  <rect class="harnais" x="40" y="742" width="18" height="14" rx="3"/>
  <text class="note" x="66" y="754">le harnais : contexte, règles, porte, preuve, juge, coffre, bac à sable, aperçu des effets</text>
  <rect class="externe" x="640" y="742" width="18" height="14" rx="3"/>
  <text class="note" x="666" y="754">hors de TaskForce</text>
</svg>
